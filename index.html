<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Tutor - SDG 4</title>
    <!-- CSS file ko link kar rahe hain -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="chat-container">
    <h2>EduAI - Smart Tutor</h2>
    <span class="sdg-tag">SDG 4: Quality Education</span>
    
    <div id="chatbox">
        <div class="message ai-msg">Hello! Main tumhara AI Tutor hu. Tumhe kis topic me help chahiye?</div>
    </div>
    
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask your study question here...">
        <button onclick="askAI()">Send</button>
    </div>
</div>

<!-- JavaScript file ko link kar rahe hain -->
<script src="script.js"></script>
</body>
</html>
